name: Crear versión
on:
  push:
    tags:
      - 'v*'  # Detecta etiquetas que comienzan con "v"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar repositorio
        uses: actions/checkout@v3  # Última versión disponible para checkout

      - name: Instalar GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Crear versión en GitHub
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh release create ${{ github.ref_name }} --notes "Release para la etiqueta ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar la versión en archivo
        run: echo "${{ github.ref_name }}" > version.txt

      - name: Commit de version.txt
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Actualizar archivo version.txt con la última versión
          file_pattern: version.txt

      - name: Guardar version.txt como artefacto
        uses: actions/upload-artifact@v2  # Cambiado a v2 para mayor compatibilidad
        with:
          name: version
          path: version.txt

      - name: Verificar directorio y contenido de archivos
        run: |
          echo "Archivos presentes en el directorio actual:"
          ls
          echo "Contenido de version.txt:"
          cat version.txt || echo "version.txt no se generó."