name: Crear versión
on:
  push:
    tags:
      - 'v*'  # Detecta etiquetas que comienzan con "v"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Configurar el repositorio
      - name: Configurar repositorio
        uses: actions/checkout@v3

      # Instalar GitHub CLI
      - name: Instalar GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      # Crear una nueva versión en GitHub usando GitHub CLI
      - name: Crear versión en GitHub
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh release create ${{ github.ref_name }} --notes "Release para la etiqueta ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guardar la versión en archivo
      - name: Guardar la versión en archivo version.txt
        run: |
          echo "${{ github.ref_name }}" > $GITHUB_WORKSPACE/version.txt
          echo "Archivo version.txt generado con contenido:"
          cat $GITHUB_WORKSPACE/version.txt

      # Verificar que el archivo version.txt se generó correctamente
      - name: Verificar contenido del archivo version.txt
        run: |
          echo "Contenido del archivo version.txt (diagnóstico):"
          cat $GITHUB_WORKSPACE/version.txt || echo "El archivo version.txt no fue generado correctamente."

      # Hacer commit del archivo version.txt
      - name: Commit de version.txt
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Actualizando archivo version.txt a la versión ${{ github.ref_name }}"
          file_pattern: version.txt

      # Verificar el estado del directorio final
      - name: Verificar directorio final
        run: |
          echo "Directorio actual:"
          pwd
          echo "Archivos presentes en el directorio actual:"
          ls -al